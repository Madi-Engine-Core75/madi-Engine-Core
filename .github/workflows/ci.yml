name: Madi-Engine-Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. إعداد بيئة Rust
    - name: Set up Rust Toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    # 2. إعداد بيئة Go
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # 3. تثبيت أدوات الـ Protobuf
    - name: Install Protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    # 4. بناء واختبار النواة (Rust Core)
    - name: Build & Test Rust Core
      run: |
        cd core/rust-core
        cargo build --verbose
        cargo test --verbose

    # 5. بناء واختبار البوابة (Go Gateway)
    - name: Build & Test Go Gateway
      run: |
        cd apps/gateway
        go build -v ./...
        go test -v ./...
