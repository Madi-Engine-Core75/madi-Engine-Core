syntax = "proto3";

package madi.engine.v1;

option go_package = "github.com/Madi-Engine-Core75/apps/gateway/internal/pb;pb";

// خدمة النواة المركزية لمعالجة العمليات الحساسة والتشفير
service MadiEngineCore {
  // معالجة الحمولة الرقمية عبر نواة Rust
  rpc ProcessPayload (PayloadRequest) returns (PayloadResponse);
  
  // التحقق من صحة وحالة النظام
  rpc HealthCheck (HealthRequest) returns (HealthResponse);
}

message PayloadRequest {
  string request_id = 1;
  bytes encrypted_data = 2; // بيانات مؤمنة بـ AES-256-GCM
  string action_type = 3;
}

message PayloadResponse {
  string request_id = 1;
  bool success = 2;
  bytes processed_data = 3;
  string error_message = 4;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  int64 timestamp = 2;
}
