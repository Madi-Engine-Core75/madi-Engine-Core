name: Madi Gateway CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Initialize Go Module (if missing)
      run: |
        if [ ! -f "go.mod" ]; then
          go mod init madi-gateway
        fi

    - name: Build Gateway
      run: GOWORK=off go build -v ./apps/gateway/cmd/server/main.go

    - name: Run Tests (Optional)
      run: |
        if ls *_test.go 1> /dev/null 2>&1; then
          GOWORK=off go test -v ./...
        else
          echo "No tests found, skipping."
        fi
