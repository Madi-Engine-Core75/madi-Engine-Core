syntax = "proto3";

package core;

option go_package = "github.com/MadiEngine-Core75/Madi-Engine-Core/proto/gen/core";

service VaultService {
  rpc AuthenticateUser (AuthRequest) returns (AuthResponse);
}

message AuthRequest {
  string username = 1;
  string password = 2;
}

message AuthResponse {
  string status = 1;
  string token = 2;
  string error = 3;
}
